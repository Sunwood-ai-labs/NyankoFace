worker_processes 1;
events { worker_connections 128; }
http {
  resolver 127.0.0.11 valid=1s ipv6=off;
  limit_req_zone $binary_remote_addr zone=mcp:1m rate=10r/s;
  upstream mcp_cluster {
    zone mcp_cluster 64k;
    server mcp-a:8000 resolve;
    server mcp-b:8000 resolve;
  }
  server {
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location = /mcp {
      client_max_body_size 1m;
      limit_req zone=mcp burst=20 nodelay;
      proxy_pass http://mcp_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host mcp.test;
      proxy_set_header Connection "";
      proxy_request_buffering on;
      proxy_next_upstream off;
      proxy_buffering off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }
  }
}
