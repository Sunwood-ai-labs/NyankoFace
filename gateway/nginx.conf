worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep every address returned by Docker DNS in one peer group. A variable
    # proxy_pass caches only one selected address and can keep choosing a
    # stopped replica until its DNS entry expires. The shared zone lets nginx
    # replace the peer set in place while the optional MCP profile scales or
    # rolls. Failed peers are suppressed until the next one-second refresh.
    upstream nyankoface_mcp_backend {
        zone nyankoface_mcp_backend 64k;
        resolver 127.0.0.11 valid=1s ipv6=off;
        server nyankoface-mcp:8000 resolve max_fails=1 fail_timeout=1s;
    }

    sendfile        on;
    keepalive_timeout  65;

    # MCP is intentionally bounded independently from Git/LFS traffic.
    limit_req_zone $binary_remote_addr zone=mcp_per_ip:10m rate=10r/s;

    # Allow arbitrarily large request bodies (Git LFS uploads can be huge).
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Port 80 is intentionally proxied through this process' TLS listener.
    # Trust its original scheme marker only on that loopback hop; a direct
    # HTTPS client cannot spoof the value used by same-origin checks.
    map "$remote_addr:$http_x_nyankoface_original_proto" $nyankoface_forwarded_proto {
        ~^127\.0\.0\.1:http$ http;
        default              $scheme;
    }

    map "$remote_addr:$http_x_nyankoface_original_real_ip" $nyankoface_real_ip {
        ~^127\.0\.0\.1:(?<nyankoface_loopback_real_ip>.+)$ $nyankoface_loopback_real_ip;
        default $remote_addr;
    }

    map $request_uri $frontend_upstream {
        default frontend:3000;
    }

    server {
        listen 80;
        server_name _;
        proxy_set_header X-NyankoFace-Trusted-Host 1;

        # Bearer credentials for the official MCP endpoint must never cross
        # the certificate-free LAN listener. Clients must use the TLS listener
        # (the published host port is NYANKOFACE_HTTPS_PORT). A TLS-terminating
        # outer proxy must target that listener, never this HTTP port.
        location ~ ^/mcp(?:/|$) {
            return 426;
        }

        # The admin control plane carries a Forgejo session, password and
        # one-time reauthentication proof. Never pass it through the
        # certificate-free listener.
        location = /admin/mcp {
            return 426;
        }
        location ^~ /admin/mcp/ {
            return 426;
        }
        location = /api/admin/mcp {
            return 426;
        }
        location ^~ /api/admin/mcp/ {
            return 426;
        }

        # Optional private worker traffic stays behind the gateway and is not
        # exposed as a public service. Deployment-specific worker addresses
        # belong in a private operations configuration.
        location /gpu-worker/ {
            proxy_pass http://host.docker.internal:8787/;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Keep a certificate-free LAN endpoint available for mobile browsers
        # and embedded webviews that cannot accept our local self-signed TLS
        # certificate. HTTPS remains available on NYANKOFACE_HTTPS_PORT.
        location / {
            proxy_pass https://127.0.0.1:443;
            proxy_ssl_verify off;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-NyankoFace-Trusted-Host 1;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-NyankoFace-Original-Proto http;
            proxy_set_header X-NyankoFace-Original-Real-IP $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        proxy_set_header X-NyankoFace-Trusted-Host 1;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ------------------------------------------------------------------
        # Official stateless MCP endpoint. Buffering is disabled for
        # Streamable HTTP SSE responses; auth and Origin reach the MCP server.
        # ------------------------------------------------------------------
        location = /mcp {
            client_max_body_size 1m;
            proxy_pass http://nyankoface_mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host nyankoface-mcp:8000;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            limit_req zone=mcp_per_ip burst=20 nodelay;

            # Buffer a complete POST before dispatch. Never replay a write at
            # the proxy: clients retry reads, and writes reuse idempotency_key.
            proxy_request_buffering on;
            # Never replay an MCP POST after dispatch. Even with retries off,
            # nginx records connection failures against the selected peer, so
            # the next client attempt uses a healthy address from the group.
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;
        }

        # ------------------------------------------------------------------
        # Forgejo (Git UI, API, LFS). ROOT_URL is configured with a "/git/"
        # suffix, so Forgejo itself generates links/redirects under /git/.
        # We proxy the sub-path straight through without stripping it.
        # ------------------------------------------------------------------
        location /git/ {
            proxy_pass http://forgejo:3000/;

            # Forgejo lives at /git, but NyankoFace's server-side control route
            # also needs the signed-in session cookie to verify repo rights.
      proxy_cookie_path ~^/git/?$ /;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Required for large Git LFS pushes/pulls: don't buffer the
            # request body on disk before forwarding it upstream.
            proxy_request_buffering off;
            client_max_body_size 0;

            # Forgejo also speaks SSH-over-HTTP style long-lived connections
            # for some git-http-backend operations; generous timeouts help.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------------------------------
        # Running Spaces (Gradio apps) proxied by spaces-runner, with
        # WebSocket support for live Gradio UI updates.
        # ------------------------------------------------------------------
        location /run/ {
            proxy_pass http://spaces-runner:8000/;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------------------------------
        # spaces-runner management API, mounted at /runner-api/ and mapped
        # to /api/ on the upstream service.
        # ------------------------------------------------------------------
        location /runner-api/ {
            proxy_pass http://spaces-runner:8000/api/;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------------------------------
        # NyankoFace Pages — public static files from a repo's gh-pages branch
        # (or its default-branch docs/ directory), served by spaces-runner.
        # ------------------------------------------------------------------
        # Keep the Pages control-plane UI on Next.js. These exact routes must
        # win over the public-site prefix below.
        location = /pages {
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-NyankoFace-Trusted-Host 1;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /pages/deploy {
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-NyankoFace-Trusted-Host 1;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /pages/deploy/ {
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-NyankoFace-Trusted-Host 1;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /pages/ {
            proxy_pass http://spaces-runner:8000/api/pages/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ------------------------------------------------------------------
        # Verified pipeline Preview/staging artifacts. Repository HTML is
        # served without portal cookies and receives a CSP sandbox from the
        # runner so untrusted content cannot call the NyankoFace control plane.
        # ------------------------------------------------------------------
        location /previews/ {
            proxy_pass http://spaces-runner:8000/api/previews/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /staging/ {
            proxy_pass http://spaces-runner:8000/api/staging/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ------------------------------------------------------------------
        # Everything else → the Next.js frontend (HF-style portal).
        # WebSocket headers are included for HMR safety even though they
        # are unnecessary in a production build.
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://$frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-NyankoFace-Trusted-Host 1;
            proxy_set_header X-Forwarded-Proto $nyankoface_forwarded_proto;
            proxy_set_header X-Real-IP $nyankoface_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
